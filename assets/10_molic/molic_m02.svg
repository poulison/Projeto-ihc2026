<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1676" viewBox="0 0 1000 1676" role="img" aria-labelledby="title desc"><title id="title">M02 — Explicar a diferença no saldo dos potes</title><desc id="desc">Conversa entre Rafael Costa e o preposto do designer. Leitura completa em docs/10_molic.md.</desc><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#344758"/></marker></defs>
<rect width="1000" height="1676" fill="white"/><g font-family="Arial, sans-serif" fill="#142d42">
<text x="30" y="35" font-size="27" font-weight="700">M02   /   Explicar a diferença no saldo dos potes</text>
<text x="30" y="65" font-size="17" fill="#445d6b">Rafael Costa   ·   O02   ·   Um episódio, um item</text>
<line x1="30" y1="81" x2="970" y2="81" stroke="#a7b7bf"/>
<circle cx="260" cy="104" r="9" fill="#14232e"/>
<path d="M260 114 V174" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="278" y="133" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: quero explicar a diferença deste item</text>
<text x="278" y="157" font-size="15" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">gco: O02</text>
<g><rect x="48" y="177" width="434" height="115" rx="13" fill="#f5f9fc" stroke="#30506a" stroke-width="2" /><line x1="48" y1="214" x2="482" y2="214" stroke="#30506a"/>
<text x="62" y="202" font-size="19" font-weight="700">O03 · Delimitar o episódio</text>
<text x="62" y="238" font-size="17" >d+u: identificar o produto e a unidade.</text>
<text x="62" y="260" font-size="17" >d: 1 conjunto contém 3 potes.</text>
<text x="62" y="282" font-size="17" >d: saldo registrado 8; contagem física 10.</text>
</g>
<path d="M260 292 V349" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="274" y="326" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: confrontar pedido, anotação e transcrições</text>
<g><rect x="48" y="352" width="434" height="141" rx="13" fill="#f5f9fc" stroke="#30506a" stroke-width="2" /><line x1="48" y1="389" x2="482" y2="389" stroke="#30506a"/>
<text x="62" y="377" font-size="19" font-weight="700">O06 · Explicar a diferença de saldo</text>
<text x="62" y="413" font-size="17" >d: duas linhas de 2 conjuntos são indícios.</text>
<text x="62" y="435" font-size="17" >u: verifico envio, origem e outra possível saída.</text>
<text x="62" y="457" font-size="17" >d+u: situação da evidência e fontes vinculadas.</text>
<text x="62" y="479" font-size="17" >d: suspeita não autoriza corrigir.</text>
</g>
<g><rect x="640" y="352" width="326" height="131" rx="13" fill="#f5f9fc" stroke="#30506a" stroke-width="2" /><line x1="640" y1="389" x2="966" y2="389" stroke="#30506a"/>
<text x="654" y="377" font-size="19" font-weight="700">O09 · Retomar a investigação</text>
<text x="654" y="413" font-size="17" >d: linhas comparadas; saldo inalterado.</text>
<text x="654" y="435" font-size="17" >d: falta confirmar a anotação.</text>
<text x="654" y="457" font-size="17" >u: revejo mudanças antes de agir.</text>
</g>
<path d="M482 390 H637" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="558" y="380" font-size="17" text-anchor="middle" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: pausar</text>
<path d="M640 464 H485" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="562" y="449" font-size="17" text-anchor="middle" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: rever a base</text>
<path d="M260 493 V581" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="274" y="544" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: indicar o que comprovei ou o que falta</text>
<g><rect x="48" y="584" width="434" height="140" rx="13" fill="#f5f9fc" stroke="#30506a" stroke-width="2" /><line x1="48" y1="621" x2="482" y2="621" stroke="#30506a"/>
<text x="62" y="609" font-size="19" font-weight="700">O07 · Fundamentar o desfecho</text>
<text x="62" y="645" font-size="17" >u: correção só com causa e autorização.</text>
<text x="62" y="667" font-size="17" >d: retirar a baixa duplicada: 8 → 10.</text>
<text x="62" y="689" font-size="17" >u: se inconclusivo, motivo e próxima verificação.</text>
<text x="62" y="711" font-size="17" >d: na pendência o saldo continua 8.</text>
</g>
<path d="M260 724 V814" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="274" y="775" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: revisar o desfecho</text>
<g><rect x="48" y="817" width="434" height="116" rx="13" fill="#f5f9fc" stroke="#30506a" stroke-width="2" /><line x1="48" y1="854" x2="482" y2="854" stroke="#30506a"/>
<text x="62" y="842" font-size="19" font-weight="700">Revisar o efeito antes de confirmar</text>
<text x="62" y="878" font-size="17" >d: item, origem, motivo e efeito sobre o saldo.</text>
<text x="62" y="900" font-size="17" >d: corrigir a transcrição não cria uma entrada.</text>
<text x="62" y="922" font-size="17" >u: confiro correção ou pendência.</text>
</g>
<path d="M482 844 H531 V666 H485" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="543" y="756" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: voltar e editar</text>
<path d="M482 889 H801" fill="none" stroke="#765322" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#tip)"/>
<text x="645" y="879" font-size="17" text-anchor="middle" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: abandonar sem salvar</text>
<circle cx="818" cy="889" r="12" fill="white" stroke="#14232e" stroke-width="2"/><circle cx="818" cy="889" r="8" fill="#14232e"/>
<text x="818" y="920" font-size="16" text-anchor="middle" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">gcc: abandono de O02</text>
<path d="M260 933 V996" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="274" y="970" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: confirmar este tratamento</text>
<rect x="249" y="999" width="22" height="22" fill="#14232e"/>
<path d="M260 1021 V1195" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="274" y="1096" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">d: desfecho gravado; consulte o histórico deste item</text>
<g><rect x="48" y="1198" width="434" height="117" rx="13" fill="#f5f9fc" stroke="#30506a" stroke-width="2" /><line x1="48" y1="1235" x2="482" y2="1235" stroke="#30506a"/>
<text x="62" y="1223" font-size="19" font-weight="700">O08 · Conferir o registro salvo</text>
<text x="62" y="1259" font-size="17" >d: desfecho, responsável, data e saldo.</text>
<text x="62" y="1281" font-size="17" >d: correção → 10; pendência → 8 não confirmado.</text>
<text x="62" y="1303" font-size="17" >u: verifico a história do item.</text>
</g>
<g><rect x="640" y="965" width="326" height="116" rx="13" fill="#fff9eb" stroke="#80571e" stroke-width="2" stroke-dasharray="7 5"/><line x1="640" y1="1002" x2="966" y2="1002" stroke="#80571e"/>
<text x="654" y="990" font-size="19" font-weight="700">Verificar uma gravação incerta</text>
<text x="654" y="1026" font-size="17" >d: ainda não há confirmação.</text>
<text x="654" y="1048" font-size="17" >u: consultar este mesmo registro;</text>
<text x="654" y="1070" font-size="17" >não solicitar nova gravação.</text>
</g>
<path d="M271 1010 H637" fill="none" stroke="#765322" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#tip)"/>
<text x="457" y="997" font-size="17" text-anchor="middle" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">d: sem confirmação da gravação</text>
<path d="M800 1081 V1130" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="648" y="1111" font-size="16" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: consultar estado</text>
<rect x="789" y="1133" width="22" height="22" fill="#14232e"/>
<path d="M789 1144 H534 V1265 H485" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="643" y="1134" font-size="17" text-anchor="middle" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">d: já estava salvo</text>
<path d="M811 1144 H920 V1084" fill="none" stroke="#765322" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#tip)"/>
<text x="900" y="1134" font-size="16" text-anchor="middle" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">d: aguarde</text>
<path d="M800 1155 V1185 H984 V610 H485" fill="none" stroke="#765322" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#tip)"/>
<text x="740" y="600" font-size="16" text-anchor="middle" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">d: falha confirmada; revise antes de repetir</text>
<path d="M260 1315 V1367" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="274" y="1346" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: o que posso informar à Mariana?</text>
<g><rect x="48" y="1370" width="434" height="94" rx="13" fill="#f5f9fc" stroke="#30506a" stroke-width="2" /><line x1="48" y1="1407" x2="482" y2="1407" stroke="#30506a"/>
<text x="62" y="1395" font-size="19" font-weight="700">O10 · Comunicar o alcance</text>
<text x="62" y="1431" font-size="17" >d: item conferido e registros ainda pendentes.</text>
<text x="62" y="1453" font-size="17" >u: comunico o alcance a Mariana fora do sistema.</text>
</g>
<path d="M260 1464 V1539" fill="none" stroke="#344758" stroke-width="2"  marker-end="url(#tip)"/>
<text x="276" y="1509" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">u: já informei o alcance à proprietária</text>
<text x="276" y="1535" font-size="17" text-anchor="start" fill="#20384a" stroke="white" stroke-width="5" paint-order="stroke" stroke-linejoin="round">gcc: O02 concluído</text>
<circle cx="260" cy="1554" r="12" fill="white" stroke="#14232e" stroke-width="2"/><circle cx="260" cy="1554" r="8" fill="#14232e"/>
<line x1="30" y1="1586" x2="970" y2="1586" stroke="#a7b7bf"/>
<text x="30" y="1613" font-size="15" font-weight="700">LEGENDA</text>
<text x="124" y="1613" font-size="17" >u: usuário   ·   d: preposto do designer   ·   d+u: signo informado com apoio do sistema</text>
<text x="30" y="1640" font-size="17" >● abertura   ·   ◎ encerramento   ·   ■ processamento   ·   tracejado: ruptura, recuperação ou abandono</text>
<text x="30" y="1662" font-size="16" >Caixa com título e divisória: cena e diálogos. Caixa tracejada: alerta. gco/gcc: abertura/fechamento da meta.</text>
</g>
</svg>
