<text x="84" y="274" font-size="24" font-weight="400" fill="#16324a" text-anchor="start">Identificar o produto e a unidade</text>
<line x1="700" y1="262.0" x2="770" y2="262.0" stroke="#4d6070" stroke-width="2.5"/>
<rect x="60" y="332" width="640" height="104" rx="10" fill="#eff4fa" stroke="#2f5a8c" stroke-width="2"/>
<text x="84" y="362" font-size="15" font-weight="700" fill="#2f5a8c" text-anchor="start">O06 · INSTRUMENTAL DIRETO</text>
<text x="84" y="396" font-size="24" font-weight="400" fill="#16324a" text-anchor="start">Explicar a diferença de saldo</text>
<line x1="700" y1="384.0" x2="770" y2="384.0" stroke="#4d6070" stroke-width="2.5"/>
<rect x="60" y="454" width="640" height="104" rx="10" fill="#eff4fa" stroke="#2f5a8c" stroke-width="2"/>
<text x="84" y="484" font-size="15" font-weight="700" fill="#2f5a8c" text-anchor="start">O07 · INSTRUMENTAL DIRETO</text>
<text x="84" y="518" font-size="24" font-weight="400" fill="#16324a" text-anchor="start">Fundamentar correção ou pendência</text>
<line x1="700" y1="506.0" x2="770" y2="506.0" stroke="#4d6070" stroke-width="2.5"/>
<rect x="60" y="576" width="640" height="104" rx="10" fill="#eff4fa" stroke="#2f5a8c" stroke-width="2"/>
<text x="84" y="606" font-size="15" font-weight="700" fill="#2f5a8c" text-anchor="start">O08 · INSTRUMENTAL DIRETO</text>
<text x="84" y="640" font-size="24" font-weight="400" fill="#16324a" text-anchor="start">Conferir o registro salvo</text>
<line x1="700" y1="628.0" x2="770" y2="628.0" stroke="#4d6070" stroke-width="2.5"/>
<rect x="60" y="698" width="640" height="104" rx="10" fill="#eff4fa" stroke="#2f5a8c" stroke-width="2"/>
<text x="84" y="728" font-size="15" font-weight="700" fill="#2f5a8c" text-anchor="start">O09 · INSTRUMENTAL DIRETO</text>
<text x="84" y="762" font-size="24" font-weight="400" fill="#16324a" text-anchor="start">Retomar o trabalho interrompido</text>
<line x1="700" y1="750.0" x2="770" y2="750.0" stroke="#4d6070" stroke-width="2.5"/>
<line x1="770" y1="262.0" x2="770" y2="750.0" stroke="#4d6070" stroke-width="2.5"/>
<path d="M770 506.0 H956" fill="none" stroke="#4d6070" stroke-width="2.5" marker-end="url(#tip)"/>
<rect x="960" y="411.0" width="480" height="190" rx="10" fill="#2f5a8c"/>
<text x="984" y="445.0" font-size="16" font-weight="700" fill="#e3efec" text-anchor="start">O02 · OBJETIVO FINAL</text>
<text x="984" y="481.0" font-size="26" font-weight="700" fill="white" text-anchor="start">Tornar o saldo do item confiável e</text>
<text x="984" y="513.0" font-size="26" font-weight="700" fill="white" text-anchor="start">explicável</text>
<rect x="60" y="840" width="640" height="104" rx="10" fill="white" stroke="#2f5a8c" stroke-width="2" stroke-dasharray="8 6"/>
<text x="84" y="870" font-size="15" font-weight="700" fill="#2f5a8c" text-anchor="start">O10 · INSTRUMENTAL INDIRETO</text>
<text x="84" y="904" font-size="24" font-weight="400" fill="#16324a" text-anchor="start">Comunicar o alcance da conferência</text>
<rect x="960" y="815" width="480" height="190" rx="10" fill="white" stroke="#146356" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="984" y="849" font-size="16" font-weight="700" fill="#146356" text-anchor="start">O01 · OBJETIVO FINAL</text>
<text x="984" y="885" font-size="26" font-weight="700" fill="#146356" text-anchor="start">Tomar uma decisão de reposição</text>
<text x="984" y="917" font-size="26" font-weight="700" fill="#146356" text-anchor="start">fundamentada e recuperável</text>
<text x="984" y="987" font-size="15" font-weight="400" fill="#146356" text-anchor="start">de Mariana (P01) · próximo ciclo</text>
<path d="M700 892.0 H956" fill="none" stroke="#4d6070" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#tip)"/>
<line x1="60" y1="1034" x2="120" y2="1034" stroke="#4d6070" stroke-width="2.5" marker-end="url(#tip)"/>
<text x="135" y="1040" font-size="18" font-weight="400" fill="#55697a" text-anchor="start">instrumental direto: apoia o objetivo final na mesma interação</text>
<line x1="60" y1="1068" x2="120" y2="1068" stroke="#4d6070" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#tip)"/>
<text x="135" y="1074" font-size="18" font-weight="400" fill="#55697a" text-anchor="start">instrumental indireto: prepara condições para que o objetivo seja alcançado depois</text>
<text x="60" y="1114" font-size="17" font-weight="400" fill="#55697a" text-anchor="start">A posição dos objetivos não indica sequência de execução, navegação entre telas nem operador temporal.</text>
