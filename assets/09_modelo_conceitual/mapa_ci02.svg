<text x="48" y="104" font-size="44" font-weight="700" fill="#16324a" text-anchor="start">Rafael Costa · Conferência de estoque</text>
<text x="48" y="146" font-size="21" font-weight="400" fill="#55697a" text-anchor="start">Victor Merker Binda · Equipe 14</text>
