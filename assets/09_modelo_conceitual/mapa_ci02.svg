<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1144" viewBox="0 0 1500 1144" role="img" aria-labelledby="title desc">
<title id="title">Rafael Costa · Conferência de estoque — mapa de objetivos</title>
<desc id="desc">Victor Merker Binda · Equipe 14. Mapa individual de objetivos da Entrega 9.</desc>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4d6070"/></marker></defs>
<rect width="1500" height="1144" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif">
