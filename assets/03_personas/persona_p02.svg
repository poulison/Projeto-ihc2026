<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1671" viewBox="0 0 1240 1671" role="img"><title>P02 — Rafael Costa: persona primária de expectativa</title><rect width="100%" height="100%" fill="#f5f7fb"/>
<rect x="0" y="0" width="1240" height="235" rx="0" fill="#162d4d" stroke="#162d4d"/>
<text x="46" y="48" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#a8d3f8" text-anchor="start">ENTREGA 03  /  PERSONA P02</text>
<text x="46" y="105" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="start">Rafael Costa</text>
<text x="46" y="143" font-family="Arial, sans-serif" font-size="22" font-weight="normal" fill="#ffffff" text-anchor="start">22 anos | Conferência e integridade dos registros</text>
<text x="46" y="181" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#cce1f7" text-anchor="start">Primária no recorte proposto • Perfil hipotético, sem pesquisa primária</text>
<text x="46" y="213" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#cce1f7" text-anchor="start">Autoria: Victor Merker Binda — 22.125.075-6</text>
<rect x="36" y="263" width="568" height="226" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="58" y="297" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Idade / contexto relevante</text>
<text x="58" y="331" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">22 anos, adulto jovem, colaborador de uma operação</text>
<text x="58" y="357.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">pequena. O fator relevante é executar várias</text>
<text x="58" y="383.20000000000005" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">tarefas operacionais sob interrupção, não sua</text>
<text x="58" y="409.30000000000007" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">idade.</text>
<rect x="636" y="263" width="568" height="226" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="658" y="297" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Ocupação/papel</text>
<text x="658" y="331" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Auxiliar operacional ou administrativo. Registra</text>
<text x="658" y="357.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">produtos e vendas, confere estoque físico,</text>
<text x="658" y="383.20000000000005" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">investiga divergências, corrige apenas o que</text>
<text x="658" y="409.30000000000007" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">estiver fundamentado e autorizado e comunica itens</text>
<text x="658" y="435.4000000000001" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">críticos à proprietária. Não assume sozinho a</text>
<text x="658" y="461.5000000000001" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">decisão financeira de compra.</text>
<rect x="36" y="509" width="568" height="176" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="58" y="543" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Conhecimento do domínio</text>
<text x="58" y="577" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Conhece códigos, nomes, variações dos produtos e a</text>
<text x="58" y="603.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">rotina de entrada e saída. Pode conhecer menos</text>
<text x="58" y="629.2" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">sobre contratos, caixa e critérios de reposição</text>
<text x="58" y="655.3000000000001" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">definidos pela proprietária.</text>
<rect x="636" y="509" width="568" height="176" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="658" y="543" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Experiência tecnológica</text>
<text x="658" y="577" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Tem familiaridade com formulários, busca,</text>
<text x="658" y="603.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">marketplace e planilhas. Aprende fluxos</text>
<text x="658" y="629.2" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">operacionais com rapidez, mas não precisa conhecer</text>
<text x="658" y="655.3000000000001" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">o funcionamento do modelo preditivo.</text>
<rect x="36" y="705" width="568" height="201" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="58" y="739" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Objetivos</text>
<text x="58" y="773" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Registrar dados sem retrabalho; localizar produtos</text>
<text x="58" y="799.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">rapidamente; corrigir erros; terminar a conferência</text>
<text x="58" y="825.2" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">do estoque; informar situações críticas com dados</text>
<text x="58" y="851.3000000000001" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">confiáveis.</text>
<rect x="636" y="705" width="568" height="201" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="658" y="739" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Necessidades</text>
<text x="658" y="773" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Busca sempre visível; cadastro curto; importação de</text>
<text x="658" y="799.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">planilha quando disponível; validação de campos;</text>
<text x="658" y="825.2" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">mensagens de erro que indiquem como corrigir;</text>
<text x="658" y="851.3000000000001" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">confirmação de salvamento; histórico de alterações</text>
<text x="658" y="877.4000000000001" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">e permissões adequadas ao papel.</text>
<rect x="36" y="926" width="568" height="176" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="58" y="960" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Dores/frustrações</text>
<text x="58" y="994" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Digitação repetitiva, produtos duplicados, códigos</text>
<text x="58" y="1020.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">inconsistentes, tela que perde dados após</text>
<text x="58" y="1046.2" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">interrupção, erro informado somente no final e</text>
<text x="58" y="1072.3" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">dúvida sobre se uma venda alterou o saldo.</text>
<rect x="636" y="926" width="568" height="176" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="658" y="960" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Motivadores</text>
<text x="658" y="994" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Manter a operação organizada, evitar cobranças por</text>
<text x="658" y="1020.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">divergência de estoque e fornecer uma base</text>
<text x="658" y="1046.2" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">confiável para a proprietária decidir.</text>
<rect x="36" y="1122" width="568" height="201" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="58" y="1156" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Restrições/acessibilidade</text>
<text x="58" y="1190" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Pode usar computador compartilhado, realizar a</text>
<text x="58" y="1216.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">tarefa em blocos curtos e sofrer interrupções por</text>
<text x="58" y="1242.1999999999998" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">separação de pedidos ou atendimento. Necessidades</text>
<text x="58" y="1268.2999999999997" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">específicas de acessibilidade ainda são</text>
<text x="58" y="1294.3999999999996" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">desconhecidas.</text>
<rect x="636" y="1122" width="568" height="201" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="658" y="1156" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Ambiente típico de uso</text>
<text x="658" y="1190" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Bancada administrativa ou área próxima ao</text>
<text x="658" y="1216.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">armazenamento de produtos, com alternância entre</text>
<text x="658" y="1242.1999999999998" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">contagem física, embalagem, computador e</text>
<text x="658" y="1268.2999999999997" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">comunicação por celular.</text>
<rect x="36" y="1343" width="568" height="176" rx="12" fill="#ffffff" stroke="#d9e1ed"/>
<text x="58" y="1377" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#126270" text-anchor="start">Comportamentos relevantes</text>
<text x="58" y="1411" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Pesquisa pelo nome ou código, registra atividades</text>
<text x="58" y="1437.1" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">em sequência, deixa uma tarefa incompleta quando</text>
<text x="58" y="1463.1999999999998" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">surge um pedido urgente e precisa retomar do ponto</text>
<text x="58" y="1489.2999999999997" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">anterior. Confere totais antes de encerrar.</text>
<text x="40" y="1619" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#22324b" text-anchor="start">Hipóteses de projeto: validar repertório, divisão do trabalho, frequência e autorização.</text>
<text x="40" y="1647" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#52637b" text-anchor="start">Revisão após feedback • 12/11/2026 • Fonte: ficha e narrativa da Entrega 3.</text>
</svg>